<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Design</title>
    <link rel="stylesheet"
          href="flexboxgrid.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Events</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <div class="eventCard">
            <img src="event1.jpg"
                 alt="Community Event">
            <h2>
                Community Clean-Up Drive
            </h2>
            <p>
                Join the city council and volunteers
                in making the community cleaner
                and greener.
            </p>
        </div>
        <div class="eventCard">
            <img src="event2.jpg"
                 alt="Community Event">
            <h2>
                Tree Plantation Program
            </h2>
            <p>
                Participate in planting trees
                and improving the environment.
            </p>
        </div>
    </div>
</body>
</html>
