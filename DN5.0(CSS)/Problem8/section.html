<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Box Model and Layout Control</title>
    <link rel="stylesheet"
          href="box&layout.css">
</head>
<body>
    <h1>
        Local Community Event Portal
    </h1>
    <div class="eventCard">
        <h2>
            Clean-Up Drive
        </h2>
        <p>
            Participate in the city clean-up event
            this weekend.
        </p>
    </div>
    <form>
        <label>
            Name:
        </label>
        <input type="text"
               placeholder="Enter your name">
        <br><br>
        <label>
            Email:
        </label>
        <input type="email"
               placeholder="Enter your email">
    </form>
    <br>
    <div class="hiddenBox">
        This uses visibility:hidden
    </div>
    <div class="noneBox">
        This uses display:none
    </div>
    <p>
        Notice the spacing difference above.
    </p>
</body>
</html>
