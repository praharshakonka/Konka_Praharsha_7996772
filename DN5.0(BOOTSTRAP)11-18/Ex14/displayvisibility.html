<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colors and Backgrounds</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <!-- Exercise 13.1 -->
  <h2 class="text-center mb-4">
    Dashboard Page
  </h2>
  <div class="row text-center">
    <div class="col-md-3 mb-4">
      <div class="bg-primary text-white p-4 rounded">
        <h4>Users</h4>
        <p>1500 Active Users</p>
      </div>
    </div>
    <div class="col-md-3 mb-4">
      <div class="bg-success text-white p-4 rounded">
        <h4>Sales</h4>
        <p>$12,000 Revenue</p>
      </div>
    </div>
    <div class="col-md-3 mb-4">
      <div class="bg-warning text-dark p-4 rounded">
        <h4>Alerts</h4>
        <p>10 Pending Alerts</p>
      </div>
    </div>
    <div class="col-md-3 mb-4">
      <div class="bg-danger text-white p-4 rounded">
        <h4>Errors</h4>
        <p>5 System Errors</p>
      </div>
    </div>
  </div>
  <!-- Exercise 13.2 -->
  <h2 class="text-center my-5">
    Gradient Section
  </h2>
  <div class="bg-dark bg-gradient text-white p-5 rounded text-center">
    <h3>Bootstrap Gradient Section</h3>
    <p>
      we use bg-dark, bg-gradient, and white text in this section .
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
