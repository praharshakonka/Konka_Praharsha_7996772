<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chrome DevTools Debugging Demo</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            padding:40px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        button{
            padding:12px 20px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        #output{
            margin-top:20px;
            font-size:20px;
            color:green;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Debugging Demo using Chrome DevTools</h2>

    <p id="message">
        Click the button to test debugging.
    </p>

    <button onclick="testDebug()">
        Run Script
    </button>

    <div id="output"></div>

</div>

<script>

    function testDebug(){

        // Console Logs
        console.log("Button Clicked");

        let eventName = "Community Sports Meet";
        let fee = 250;

        console.log("Event Name:", eventName);
        console.log("Event Fee:", fee);

        // Breakpoint
        debugger;

        // Display Output
        document.getElementById("output").innerHTML =
            "Selected Event: " + eventName +
            "<br>Event Fee: ₹" + fee;

        console.log("Output displayed successfully");
    }

</script>

</body>
</html>
