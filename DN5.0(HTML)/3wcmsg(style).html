<!DOCTYPE html>
<html>
<head>
    <title>Welcome Banner</title>

    <style>
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 3px;
        }
    </style>
</head>

<body>

    <div id="welcomeBanner">
        <h1 class="highlight">Welcome Back, User!</h1>

        <p>
            We are happy to see you again.
            <span style="color: red; font-weight: bold;">
                Special Offer: Get 50% OFF today!
            </span>
        </p>

        <p class="highlight">
            Enjoy exclusive member benefits and rewards.
        </p>
    </div>

</body>
</html>
