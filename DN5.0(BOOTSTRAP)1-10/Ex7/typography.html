<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7 - Typography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <!-- Exercise 7.1 -->
  <h1 class="display-1 text-danger">
    Bootstrap Typography
  </h1>
  <p class="lead">
    This is a lead paragraph using Bootstrap.
  </p>
  <p class="text-muted">
    This text is muted.
  </p>
  <p class="fw-bold">
    This text is bold.
  </p>
  <p class="fst-italic">
    This text is italic.
  </p>
  <hr>
  <!-- Exercise 7.2 -->
  <h2 class="mb-3">Text Transform Utilities</h2>
  <p class="text-uppercase">
    this text becomes uppercase
  </p>
  <p class="text-lowercase">
    THIS TEXT BECOMES LOWERCASE
  </p>
  <p class="text-capitalize">
    this text becomes capitalized
  </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
