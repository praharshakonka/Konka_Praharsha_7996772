<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6 - Flexbox Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <!-- Exercise 6.1 -->
  <h2 class="text-center mb-4">Responsive FlexBox Utilities</h2>
  <div class="d-flex flex-column flex-md-row bg-dark p-3">
    <div class="text-white p-2">Home</div>
    <div class="text-white p-2">About</div>
    <div class="text-white p-2">Services</div>
    <div class="text-white p-2">Contact</div>

  </div>
  <!-- Exercise 6.2 -->
  <h2 class="text-center mt-5 mb-4">Card Layout</h2>
  <div class="card p-3">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h5>Product Card</h5>
        <p class="mb-0">Sample description</p>
      </div>
      <button class="btn btn-primary">
        Buy Now
      </button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
