<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4 - Column Layouts</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">


  <!-- Exercise 4.1 -->
  <h2 class="text-center mb-4">Two Column Layout</h2>
  <div class="row mb-5">
    <!-- Sidebar -->
    <div class="col-md-3 bg-light p-4">
      <h4>Sidebar</h4>
      <p>Navigation Links</p>
    </div>
    <!-- Content Area -->
    <div class="col-md-9 bg-primary text white p-4">
      <h4>Main Content</h4>
      <p>This is the content area using col-md-9.</p>
    </div>
  </div>


  <!-- Exercise 4.2 -->
  <h2 class="text-center mb-4">Four Column Layout</h2>
  <div class="row text-center">
    <div class="col-sm-3 bg-danger text-white p-3">
      Column 1
    </div>
    <div class="col-sm-3 bg-success text-white p-3">
      Column 2
    </div>
    <div class="col-sm-3 bg-warning text-dark p-3">
      Column 3
    </div>
    <div class="col-sm-3 bg-info text-white p-3">
      Column 4
    </div>
  </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
