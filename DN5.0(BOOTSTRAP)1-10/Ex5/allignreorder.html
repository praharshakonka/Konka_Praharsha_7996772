<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5 - Alignment and Reordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

  <!-- Exercise 5.1 -->
  <h2 class="text-center mb-4">Centered Content</h2>

  <div class="row justify-content-center align-items-center bg-light"
       style="height:200px;">

    <div class="col-4 bg-primary text-white text-center p-3">
      Center Box
    </div>

  </div>

  <!-- Exercise 5.2 -->
  <h2 class="text-center mt-5 mb-4">Column Reordering</h2>
  <div class="row text-center">
    <div class="col-md-6 order-md-2 bg-secondary text-white p-4">
      Column 1
    </div>
    <div class="col-md-6 order-md-1 bg-info text-white p-4">
      Column 2
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
