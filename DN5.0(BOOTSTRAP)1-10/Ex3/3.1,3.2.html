<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 - Grid Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2 class="text-center mb-4">Responsive Grid Layout</h2>
  <div class="row text-center">
    <!-- Column 1 -->
    <div class="col-12 col-md-6 col-lg-4 bg-primary text-white p-3">
      Column 1
    </div>
    <!-- Column 2 -->
    <div class="col-12 col-md-6 col-lg-4 bg-success text-white p-3">
      Column 2
    </div>
    <!-- Column 3 -->
    <div class="col-12 col-md-6 col-lg-4 bg-danger text-white p-3">
      Column 3
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
