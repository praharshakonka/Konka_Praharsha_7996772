<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2.2 - Bootstrap JS</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="bootstrap.min.css">
</head>

<body>

  <div class="container mt-5 text-center">
    <h1 class="text-primary">Bootstrap JS Plugin Example</h1>

    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#demoModal">
      Open Modal
    </button>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="demoModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Hello</h5>
        </div>

        <div class="modal-body">
          Bootstrap JavaScript is working!
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="bootstrap.bundle.min.js"></script>

</body>
</html>
